current_understanding: |
  MAJOR FINDING: CFG guidance scale has a large monotonic effect on FID. The current default
  (CFG=15) significantly hurts FID (7.40) vs CFG=5 (FID=6.60). This is a 10.8% improvement
  with zero training cost. However, lower CFG reduces R-precision (0.797→0.671), reflecting
  a tradeoff between generation quality (FID) and conditioning fidelity (R-prec).

  The interaction-aware training (H2) clearly works — all evals show FID in the 6-8 range.
  H3 (latent-8) pipeline is underway; if it matches H2's quality, we can apply CFG=5 there too.

  The ego encoder pretraining is working well (cos~0.89 at epoch 60/200).

  Key remaining questions:
  1. Does larger latent (H3) improve FID beyond CFG=5 of H2 (currently FID=6.60)?
  2. Is there a better CFG sweet spot (e.g., 7-8) that balances FID and R-prec?
  3. Does H4 (cross-attention encoder) recover R-prec without sacrificing FID?
