      H2 R@1=0.671. H4 FREEZE_EGO=True prevents encoder from adapting to cross-attention use case.
      The pretrained ego encoder was trained for contrastive alignment (mean-pooled → VAE latent),
      not for per-timestep cross-attention. Unfreezing allows it to specialize for this role.
      Config: configs/config_ego_motion_new_vae_stoch_latent_4_h6_unfreeze_ego.yaml
      Script: slurm/diffusion_training_h6_unfreeze_ego_helma.sh
