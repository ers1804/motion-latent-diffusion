  CFG=7 is the best combined tradeoff: FID=6.716 (+1.7% vs CFG=5), R-prec=0.724 (+7.9%).

  MAJOR FINDING 2: FID REGRESSION in H2 — CONFIRMED. Epoch=4399 (FID=6.603) is best H2
  checkpoint. Model regressed at epoch=4599 (FID=8.40), partially recovered at 4999 (FID=7.51).
  Early stopping is critical. Root cause: training oscillation independent of loss.

  H2 BASELINE (final): FID=6.603 ± 0.067, Diversity=5.779, R-prec@1=0.671 (epoch=4399, CFG=5).

  H3 REJECTED: Latent-8 is 14.5% worse FID than latent-4 at epoch=4399. R-prec essentially
  unchanged (0.676 vs 0.671). Key insight: R-prec bottleneck is ego encoder architecture, NOT
  latent dimension.

  H4 TRAINING COMPLETE (segment-2 finished 2026-04-04):
    BEST CHECKPOINT: epoch=3399 — FID=3.770 (training-time val), R@1=0.535 (training-time val)
    MONOTONIC DEGRADATION after epoch=3399: both FID and R@1 worsen through epoch=4999
    Training trajectory: FID 3.766(ep3199)→3.770(ep3399)→4.508(ep4999), R@1 0.529→0.535→0.511
    R@1 CEILING: max R@1 = 0.535, never reaches H2=0.671 → FROZEN EGO ENCODER IS BOTTLENECK
    Definitive test evals submitted (epoch=3399 CFG=5/10/15): jobs 351794/351795/351796

  H4 INTERMEDIATE EVALS (epoch=3199, confirmed 2026-04-03):
    CFG=5:  FID=3.968 ±0.209, R-prec@1=0.510, MM=4.117
    CFG=10: FID=3.644 ±0.145, R-prec@1=0.540, MM=3.936
    CFG=15: FID=3.617 ±0.131, R-prec@1=0.515, MM=3.938
    H4 FID FLAT ACROSS CFG (unlike H2 where FID rises steeply 6.60→7.40)

  KEY INSIGHT — FROZEN EGO ENCODER BOTTLENECK:
    H4 uses FREEZE_EGO=True. The ego encoder was pretrained for contrastive alignment
    (mean-pooled output → VAE latent). Frozen, it cannot adapt its per-timestep representations
    to the cross-attention use case the denoiser needs. This explains the R@1 ceiling.
    H6 (FREEZE_EGO=False) is the next logical step. Config + script created.

  H6 DEFINITIVELY REJECTED (2026-04-15):
    All 3 evaluated checkpoints (ep=2099, 3299, 3399) are WORSE than H4 on ALL metrics.
    ep=3399 (seg-2 definitive): FID=5.079, R@1=0.352, MM=2.618 — no improvement from seg-1.
    R@1 peaked at ep=3299 training-time (0.398) and is now declining.
    MultiModality collapse confirmed: MM=2.455–2.618 vs H4 3.956.
    FREEZE_EGO=True is the correct architectural choice. H4 is the best system.

  PHASE: CONCLUDE (2026-04-15)
    Decision: research has sufficient evidence for publication.
    H4 provides strong positive result (49% FID improvement, non-overlapping CIs).
    H6 provides clean negative ablation (full unfreezing → MM collapse).
    Literature supports frozen encoder design (SD/CLIP, DreamBooth/DINO pattern).
    Next step: invoke ml-paper-writing skill.
