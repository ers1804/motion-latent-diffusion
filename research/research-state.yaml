hypotheses:
  H0-baseline:
    description: "Train on all datasets with standard VAE (latent-4, no interaction features)"
    status: tested
    result: "No metrics recorded — unclear baseline"

  H1-interactive-subset:
    description: "Train only on interactive ego-ped scenarios (crop to interaction window)"
    status: partially_tested
    result: "Trained, no metrics in WandB summary"

  H2-interaction-aware:
    description: "Interaction crop + interaction-weighted sampling focuses learning on ego-ped interactions"
    prediction: "FID < 10, diversity closer to GT, better R-precision"
    status: completed
    result: |
      Epoch 4399 (CFG=5): FID=6.603 ± 0.067 ← BEST CHECKPOINT (CONFIRMED BEST)
      Epoch 4599 (CFG=5): FID=8.400 ± 0.102 ← REGRESSION
      Epoch 4999 (CFG=5): FID=7.510 ± 0.084 ← PARTIAL RECOVERY (not as good as 4399)
      Key finding: epoch 4399 is CONFIRMED best. Final checkpoint ≠ best checkpoint.
      H2 best FID = 6.603 at CFG=5, epoch=4399. This is the H2 baseline for H3 comparison.

  H3-larger-latent:
    description: "Latent dim 8 (vs 4) gives VAE more capacity to represent motion diversity"
    prediction: "Lower VAE reconstruction loss; when used for diffusion → better FID/diversity"
    status: diffusion_training
    result: "VAE done (loss=0.0142). Ego encoder DONE (200 epochs, cos~0.92). Diffusion training started (job 329789)."

  H4-ego-encoder-architecture:
    description: "Richer ego encoder (cross-attention instead of mean pooling) improves conditioning"
    prediction: "Better R-precision (ego↔motion alignment)"
    status: untested

  H5-guidance-scale:
    description: "Guidance scale sweep {5,10,15,20} affects quality-diversity tradeoff"
    prediction: "Lower CFG → more diverse; higher CFG → better R-precision but lower diversity"
    status: tested
    result: |
      COMPLETED (job 327950). Key finding: FID monotonically increases with CFG.
      CFG=5: FID=6.60, R-prec@1=0.671, MM=3.50
      CFG=10: FID=6.96, R-prec@1=0.767, MM=3.03
      CFG=15: FID=7.40, R-prec@1=0.797, MM=2.72  [current default]
      CFG=20: FID=7.86, R-prec@1=0.815, MM=2.57
      Current CFG=15 was suboptimal for FID. CFG=5 gives 10.8% FID improvement.
      Diversity barely changes across CFG values (5.74-5.78).

  H6-joint-vae-diffusion:
    description: "Fine-tuning VAE jointly with diffusion (unfreeze ego encoder) improves alignment"
    prediction: "Better R-precision"
    status: untested

next_actions:
  - "CONFIRMED: H2 best FID=6.603 (epoch=4399, CFG=5). Epoch=4999 gave 7.510 — no full recovery."
  - "Await H3 diffusion training (job 329789, started 2026-03-30) — 24h wall time, eval when done"
  - "When H3 finishes — prepare eval_h3_cfg5.sh and submit; compare to H2 best (FID=6.603)"
  - "Plan H4: cross-attention ego encoder (trans_dec) to recover R-prec without FID cost"
  - "Consider CFG=7 sweep: explore FID/R-prec sweet spot between CFG=5 (FID best) and CFG=15 (R-prec best)"

current_understanding: |
  MAJOR FINDING 1: CFG=5 gives FID=6.603 (10.8% better than CFG=15). Use CFG=5 for all evals.

  MAJOR FINDING 2: FID REGRESSION in H2 — CONFIRMED. Epoch=4399 (FID=6.603) is the best H2
  checkpoint. The model regressed to FID=8.40 at epoch=4599, then partially recovered to 7.51
  at epoch=4999 but did NOT return to its best. Early stopping is critical for this architecture.
  Root cause: training oscillation independent of loss (loss was flat ~0.286-0.287 throughout).
  May be aggravated by duplicate training job 327881 running in parallel.

  H2 BASELINE (final): FID=6.603 ± 0.067, Diversity=5.779, R-prec@1=0.671 (epoch=4399, CFG=5).

  H3 RUNNING: Latent-8 diffusion training (job 329789, 24h wall). VAE loss=0.0142 (better than
  latent-4), ego encoder cos=0.92. Will compare H3 best vs H2 best FID=6.603.

  Key remaining questions:
  1. Does H3 (latent-8) beat H2's best FID=6.603 at CFG=5?
  2. Can H4 (cross-attention ego encoder) recover R-prec@1 > 0.8 without FID cost?
  3. Is CFG=7 a better FID/R-prec tradeoff than CFG=5 (FID=6.60) or CFG=15 (R-prec=0.797)?
