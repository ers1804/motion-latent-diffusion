research_question: |
  Can interaction-aware training (ego-pedestrian proximity-based cropping + weighted sampling)
  and larger VAE latent spaces (dim 8 vs 4) improve the quality and realism of ego-conditioned
  pedestrian motion generation as measured by FID, diversity, and R-precision?

