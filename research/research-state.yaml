  run: ego_motion_diffusion_interaction_crop_weighted_1  # crashed at ~mid-training
  FID: 7.5029
  Diversity: 5.6653
  GT_Diversity: 5.3433
  R_precision_top_1: 0.8254
  note: "Crashed before completion. Latent-4, interaction_crop+weighted_sampling, CFG=15"

