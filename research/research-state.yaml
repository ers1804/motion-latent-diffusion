      MM=2.581 (H4: 3.956) — H6 generates LESS diverse motions per condition than H4.
      This aligns with encoder over-specialization: the ego encoder encodes discriminative not generative features.

hypotheses:
  H0-baseline:
    description: "Train on all datasets with standard VAE (latent-4, no interaction features)"
    status: tested
    result: "No metrics recorded — unclear baseline"

  H1-interactive-subset:
    description: "Train only on interactive ego-ped scenarios (crop to interaction window)"
    status: partially_tested
    result: "Trained, no metrics in WandB summary"

  H2-interaction-aware:
    description: "Interaction crop + interaction-weighted sampling focuses learning on ego-ped interactions"
    prediction: "FID < 10, diversity closer to GT, better R-precision"
    status: completed
    result: |
      Epoch 4399 (CFG=5): FID=6.603 ± 0.067 ← BEST CHECKPOINT (CONFIRMED BEST)
      Epoch 4599 (CFG=5): FID=8.400 ± 0.102 ← REGRESSION
      Epoch 4999 (CFG=5): FID=7.510 ± 0.084 ← PARTIAL RECOVERY (not as good as 4399)
      Key finding: epoch 4399 is CONFIRMED best. Final checkpoint ≠ best checkpoint.
      H2 best FID = 6.603 at CFG=5, epoch=4399. This is the H2 baseline for H3 comparison.

  H3-larger-latent:
    description: "Latent dim 8 (vs 4) gives VAE more capacity to represent motion diversity"
    prediction: "Lower VAE reconstruction loss; when used for diffusion → better FID/diversity"
    status: rejected
    result: |
      REJECTED: Latent-8 is significantly WORSE than latent-4 at equal epoch=4399.
      CFG=5: H3 FID=7.563 ± 0.078 vs H2 FID=6.603 ± 0.067 → -14.5% (worse FID)
      CFG=7: H3 FID=8.131 ± 0.103 vs H2 FID=6.716 ± 0.068 → -21.1% (worse FID)
      R-prec@1: H3=0.676 vs H2=0.671 (CFG=5) — essentially identical.
      Diversity: H3=5.842 vs H2=5.779 (+1.1%) — marginal improvement not worth FID cost.
      Root cause: Same-capacity denoiser cannot model 8D latent distribution as well as 4D.
      Lesson: Increasing latent dim without scaling denoiser capacity is counterproductive.

  H4-ego-encoder-architecture:
    description: "Cross-attention ego conditioning (trans_dec arch, full T=196 ego sequence as K/V) instead of mean-pooled single token"
    prediction: "R-prec@1 improves significantly (>=0.80 at CFG=5); FID may improve too due to better temporal alignment. Mechanism: denoiser sees full ego temporal context per denoising step."
    status: completed
    result: |
      DEFINITIVE RESULTS (epoch=3399 best checkpoint):
      CFG=5:  FID=3.842 ±0.108, R@1=0.506 ±0.009, MM=4.141  [H2: FID=6.603, R@1=0.671]
      CFG=10: FID=3.392 ±0.179, R@1=0.548 ±0.002, MM=3.956  [H2: FID=6.963, R@1=0.767]
      CFG=15: FID=3.547 ±0.122, R@1=0.536 ±0.003, MM=3.910  [H2: FID=7.400, R@1=0.797]
      Best point: CFG=10 — FID=3.392 (48.6% better than H2), R@1=0.548 (18.3% below H2).
      PREDICTION PARTIALLY CONFIRMED: FID improved dramatically. R@1 did NOT reach H2 level.
      R@1 CEILING: max=0.548 across all CFG and all epochs. FREEZE_EGO=True is the bottleneck.
      FID still flat across CFG (H4 characteristic behavior).
    motivation: "H3 showed R-prec is decoupled from latent dim — the bottleneck is ego encoder quality, not latent capacity. EgoEncoderPooled compresses 196 timesteps to 1 token, losing temporal structure. trans_dec lets z query the full 196-step sequence."
    implementation:
      code_changes:
        - "pretrain_ego_encoder.py: squeeze(1) → mean(dim=1) (×2) for EgoEncoder compatibility (T=196)"
        - "mld/models/modeltype/mld.py:1002: squeeze(1) → mean(dim=1) for ego_emb (B,256) in rs_set"
        - "configs/config_ego_motion_new_vae_stoch_latent_4_trans_dec.yaml: new H4 config (EgoEncoder, arch=trans_dec)"
        - "slurm/pretrain_ego_encoder_h4_helma.sh, diffusion_training_h4_trans_dec_helma.sh, resume_h4_diffusion_helma.sh, eval_h4_cfg{5,7}_helma.sh"
      commit: "f63c596 research(protocol): H4 cross-attention ego conditioning (trans_dec arch)"

  H5-guidance-scale:
    description: "Guidance scale sweep {5,10,15,20} affects quality-diversity tradeoff"
    prediction: "Lower CFG → more diverse; higher CFG → better R-precision but lower diversity"
    status: tested
    result: |
      COMPLETED (job 327950). Key finding: FID monotonically increases with CFG.
      CFG=5: FID=6.60, R-prec@1=0.671, MM=3.50
      CFG=10: FID=6.96, R-prec@1=0.767, MM=3.03
      CFG=15: FID=7.40, R-prec@1=0.797, MM=2.72  [current default]
      CFG=20: FID=7.86, R-prec@1=0.815, MM=2.57
      Current CFG=15 was suboptimal for FID. CFG=5 gives 10.8% FID improvement.
      Diversity barely changes across CFG values (5.74-5.78).

  H6-unfreeze-ego-encoder:
    description: "Unfreeze ego encoder during diffusion training so encoder co-adapts with denoiser"
    prediction: "R-prec@1 improves toward or beyond H2 (0.671); FID may remain low because architecture is same"
    status: rejected
    slurm_job_seg1: 365378
    slurm_job_seg2: 368901  # 368862 FAILED (resume path was file not dir; fixed)
    submitted_seg1: "2026-04-13"
    submitted_seg2: "2026-04-15"
    seg1_result: |
      SEG-1 COMPLETE (24h SLURM timeout at epoch ~3359, last checkpoint epoch=3299).
      Training trajectory (checkpoint eval points):
        ep=99:   FID=9.835, R@1=0.036   (start — encoder adapting)
        ep=799:  FID=6.664, R@1=0.044
        ep=999:  FID=6.011, R@1=0.065
        ep=1099: FID=5.283, R@1=0.079
