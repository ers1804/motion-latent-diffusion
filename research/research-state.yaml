    prediction: "FID < 10, diversity closer to GT, better R-precision"
    status: training
    result: "Epoch 4399 eval: FID=7.40 (CFG=15) or 6.60 (CFG=5). Training resumed to epoch 5000 (job 327990)."

  H3-larger-latent:
    description: "Latent dim 8 (vs 4) gives VAE more capacity to represent motion diversity"
