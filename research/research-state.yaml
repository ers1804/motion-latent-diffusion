current_understanding: |
  MAJOR FINDING 1: CFG=5 gives FID=6.603 (10.8% better than CFG=15). Use CFG=5 for all evals.
  CFG=7 is the best combined tradeoff: FID=6.716 (+1.7% vs CFG=5), R-prec=0.724 (+7.9%).

  MAJOR FINDING 2: FID REGRESSION in H2 — CONFIRMED. Epoch=4399 (FID=6.603) is best H2
  checkpoint. Model regressed at epoch=4599 (FID=8.40), partially recovered at 4999 (FID=7.51).
  Early stopping is critical. Root cause: training oscillation independent of loss.

  H2 BASELINE (final): FID=6.603 ± 0.067, Diversity=5.779, R-prec@1=0.671 (epoch=4399, CFG=5).

  H3 REJECTED: Latent-8 is 14.5% worse FID than latent-4 at epoch=4399. R-prec essentially
  unchanged (0.676 vs 0.671). Key insight: R-prec bottleneck is ego encoder architecture, NOT
  latent dimension. EgoEncoderPooled compresses 196 timesteps → 1 token, discarding temporal structure.

  H4 CONFIRMED RESULT (test eval, epoch 3199, CFG=5, job 346950):
    FID = 3.968 ± 0.209 — 40% better than H2 best (6.603 ± 0.067). NON-OVERLAPPING CIs.
    R-prec@1 = 0.510 ± 0.009 — 24% LOWER than H2 (0.671). H4 is still mid-training.
    R-prec@2 = 0.672, R-prec@3 = 0.748
    MultiModality = 4.117 ± 0.432 — 17% HIGHER than H2 (3.503). More diverse per condition.
    Diversity = 5.891 ± 0.057 (vs GT 5.496 — slightly over-diverse)
    Epoch=3199 is only 64% of H2's best epoch (4399). R-prec expected to improve.
