  H4-ego-encoder-architecture:
    description: "Richer ego encoder (cross-attention instead of mean pooling) improves conditioning"
    prediction: "Better R-precision (ego↔motion alignment)"
    status: untested

  H5-guidance-scale:
    description: "Guidance scale sweep {5,10,15,20} affects quality-diversity tradeoff"
    prediction: "Lower CFG → more diverse; higher CFG → better R-precision but lower diversity"
    status: tested
    result: |
      COMPLETED (job 327950). Key finding: FID monotonically increases with CFG.
      CFG=5: FID=6.60, R-prec@1=0.671, MM=3.50
      CFG=10: FID=6.96, R-prec@1=0.767, MM=3.03
      CFG=15: FID=7.40, R-prec@1=0.797, MM=2.72  [current default]
      CFG=20: FID=7.86, R-prec@1=0.815, MM=2.57
      Current CFG=15 was suboptimal for FID. CFG=5 gives 10.8% FID improvement.
      Diversity barely changes across CFG values (5.74-5.78).

  H6-joint-vae-diffusion:
    description: "Fine-tuning VAE jointly with diffusion (unfreeze ego encoder) improves alignment"
    prediction: "Better R-precision"
    status: untested

