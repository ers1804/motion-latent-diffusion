        ep=2099: FID=4.789, R@1=0.273   ← BEST FID (training-time val)
        ep=2699: FID=5.283, R@1=0.355   (FID degrading as R@1 improves)
        ep=2999: FID=5.889, R@1=0.373
        ep=3299: FID=5.273, R@1=0.398   ← BEST R@1 so far (still IMPROVING)
      KEY FINDING: FID/R@1 TRADEOFF. As the encoder adapts for cross-attention,
      R@1 improves but FID degrades. Best FID (4.789) is at ep=2099 but R@1 still low (0.273).
      Both FID and R@1 still well below H4 best (FID=3.392, R@1=0.548 at ep=3399).
      R@1 still strongly increasing at ep=3299 — training needs to continue.
      Intermediate evals COMPLETED: ep=3299 (job 368863) and ep=2099 (job 368864), both CFG=10.
      DEFINITIVE EVAL RESULTS (3× replicated, CFG=10):
        ep=2099: FID=4.952 ±0.088, R@1=0.263 ±0.009, Diversity=5.957, MM=2.455
        ep=3299: FID=5.311 ±0.060, R@1=0.348 ±0.004, Diversity=6.034, MM=2.581
      NOTE: Definitive FID higher than training-time val (4.789→4.952, 5.273→5.311).
      R@1 also slightly lower (0.398→0.348 at ep=3299). Both are normal: 3× replication
