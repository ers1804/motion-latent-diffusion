####################################
# Ego-Conditioned Motion Generation
# Diffusion training config
####################################

NAME: ego_motion_vae
SEED_VALUE: 1234

DEBUG: False
OVERFIT: False
ACCELERATOR: 'gpu'
DEVICE: [0]

#####################################
# Training Settings
#####################################
TRAIN:
  # Train diffusion (VAE should be pre-trained)
  STAGE: vae
  ABLATION:
    SKIP_CONNECT: True
    PE_TYPE: mld
    DIFF_PE_TYPE: mld
  DATASETS: ['egomotion']
  NUM_WORKERS: 11
  BATCH_SIZE: 128
  END_EPOCH: 6000

  RESUME: ''
  PRETRAINED_VAE: ''  # Set this to your VAE checkpoint path
  PRETRAINED: ''
  
  OPTIM:
    TYPE: AdamW
    LR: 1e-4

#####################################
# Validation Settings
#####################################
EVAL:
  DATASETS: ['egomotion']
  BATCH_SIZE: 32
  SPLIT: test

#####################################
# Testing Settings
#####################################
TEST:
  CHECKPOINTS: ''
  DATASETS: ['egomotion']
  SPLIT: test
  BATCH_SIZE: 1
  MEAN: False
  NUM_SAMPLES: 1
  FACT: 1
  COUNT_TIME: False 

#####################################
# Dataset Settings
#####################################
DATASET:
  JOINT_TYPE: 'humanml3d'
  NFEATS: 263
  NJOINTS: 22
  
  # HumanML3D path (needed for mean/std when using HumanML3D VAE)
  HUMANML3D:
    ROOT: 'datasets/humanml3d'     # Path to HumanML3D data (has Mean.npy, Std.npy)
    UNIT_LEN: 4
  
  # EgoMotion specific settings
  EGOMOTION:
    # Single dataset:
    # ROOT: 'data/diffusion/waymo'
    
    # Multiple datasets (train on all):
    ROOT: 
      - '/home/erik/NAS/methods/diffusion_gen/data/diffusion/ava'
      - '/home/erik/NAS/methods/diffusion_gen/data/diffusion/waymo'
      - '/home/erik/NAS/methods/diffusion_gen/data/diffusion/nuscenes'
      # - '/home/erik/NAS/methods/diffusion_gen/data/diffusion/humanml3d'  # Add if has ego data
    
    MAX_EGO_LEN: 196              # Max ego trajectory length
    FPS: 20                        # Your data FPS
    EGO_SCALE: 50.0               # Ego normalization: divide by this (meters)
    
    # Motion normalization (CRITICAL - must match VAE training!)
    # Option 1: Use HumanML3D mean/std (for testing with HumanML3D VAE)
    #           Leave MEAN_STD_PATH empty, will auto-use HUMANML3D.ROOT
    # Option 2: Use your own mean/std (for your own VAE)
    #           Set MEAN_STD_PATH to directory containing Mean.npy, Std.npy
    MEAN_STD_PATH: '/home/erik/NAS/methods/diffusion_gen/data/vae/mean_std_txt/ava_human_nuscenes_waymo'             # Empty = use HUMANML3D.ROOT, or set your path
    EGO_MEAN_STD_PATH: '/home/erik/NAS/methods/diffusion_gen/data/stats'
  SAMPLER:
    MAX_LEN: 196                   # Max motion length
    MIN_LEN: 40                    # Min motion length
    MAX_TEXT_LEN: 20               # Not used for ego, but required

#####################################
# Model Settings
#####################################
model:
  vae: true
  model_type: mld
  condition: 'text'                 # Changed from 'text'
  latent_dim: [1, 256]             # MLD-1 (best for generation)
  ff_size: 1024
  num_layers: 9
  num_heads: 4
  dropout: 0.1
  activation: gelu
  guidance_scale: 7.5
  guidance_uncondp: 0.1            # 10% dropout for CFG

#####################################
# Loss Settings
#####################################
LOSS:
  TYPE: mld
  LAMBDA_LATENT: 1.0e-5
  LAMBDA_KL: 1.0e-4
  LAMBDA_REC: 1.0
  LAMBDA_GEN: 1.0
  LAMBDA_CROSS: 1.0
  LAMBDA_CYCLE: 0.0
  LAMBDA_PRIOR: 0.0
  DIST_SYNC_ON_STEP: False

#####################################
# Metric Settings
#####################################
METRIC:
  TYPE: ['TemosMetric', 'TM2TMetrics']  # No metrics for ego (TemosMetric requires HumanML3D/KIT)
  # FORCE_IN_METER: True
  # DIST_SYNC_ON_STEP: False

#####################################
# Logger Settings
#####################################
LOGGER:
  SACE_CHECKPOINT_EPOCH: 100
  LOG_EVERY_STEPS: 1
  VAL_EVERY_STEPS: 100
  TENSORBOARD: True
  WANDB:
    PROJECT: null                  # Set to your wandb project name to enable
    OFFLINE: False
    RESUME_ID: null
