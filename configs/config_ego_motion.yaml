####################################
# Ego-Conditioned Motion Generation
# Diffusion training config
####################################

NAME: ego_motion_diffusion_N1
SEED_VALUE: 1234

DEBUG: False
ACCELERATOR: 'gpu'
DEVICE: [0]

#####################################
# Training Settings
#####################################
TRAIN:
  # Train diffusion (VAE should be pre-trained)
  STAGE: diffusion
  DATASETS: ['egomotion']
  NUM_WORKERS: 4
  BATCH_SIZE: 64
  END_EPOCH: 3000

  RESUME: 'experiments/mld/ego_motion_diffusion_N1'
  PRETRAINED_VAE: '/home/mohan/nas_drive/methods/diffusion_gen/models/vae/1222_PELearn_VAE_MEncDec49_MdiffEnc49_bs64_clip_uncond75_01/checkpoints/epoch=5999.ckpt'  # Set this to your VAE checkpoint path
  PRETRAINED: ''
  
  OPTIM:
    TYPE: AdamW
    LR: 1e-4
  
  ABLATION:
    SKIP_CONNECT: True
    PE_TYPE: mld
    DIFF_PE_TYPE: mld
    PREDICT_EPSILON: True
    VAE_TYPE: mld
    MLP_DIST: False
    IS_DIST: False

#####################################
# Validation Settings
#####################################
EVAL:
  DATASETS: ['egomotion']
  BATCH_SIZE: 32
  SPLIT: test

#####################################
# Testing Settings
#####################################
TEST:
  CHECKPOINTS: ''
  DATASETS: ['egomotion']
  SPLIT: test
  BATCH_SIZE: 1
  MEAN: False
  NUM_SAMPLES: 1
  FACT: 1
  COUNT_TIME: False 

#####################################
# Dataset Settings
#####################################
DATASET:
  JOINT_TYPE: 'humanml3d'
  NFEATS: 263
  NJOINTS: 22
  
  # HumanML3D path (needed for mean/std when using HumanML3D VAE)
  HUMANML3D:
    ROOT: 'datasets/humanml3d'     # Path to HumanML3D data (has Mean.npy, Std.npy)
    UNIT_LEN: 4
  
  # EgoMotion specific settings
  EGOMOTION:
    # Single dataset:
    # ROOT: 'data/diffusion/waymo'
    
    # Multiple datasets (train on all):
    ROOT: 
      - '/home/mohan/nas_drive/methods/diffusion_gen/data/diffusion/waymo'
      - '/home/mohan/nas_drive/methods/diffusion_gen/data/diffusion/nuscenes'
      - '/home/mohan/nas_drive/methods/diffusion_gen/data/diffusion/ava'
      # - 'data/diffusion/HumanML3D'  # Add if has ego data
    
    MAX_EGO_LEN: 200              # Max ego trajectory length
    FPS: 20                        # Your data FPS
    EGO_SCALE: 50.0               # Ego normalization: divide by this (meters)
    
    # Motion normalization (CRITICAL - must match VAE training!)
    # Option 1: Use HumanML3D mean/std (for testing with HumanML3D VAE)
    #           Leave MEAN_STD_PATH empty, will auto-use HUMANML3D.ROOT
    # Option 2: Use your own mean/std (for your own VAE)
    #           Set MEAN_STD_PATH to directory containing Mean.npy, Std.npy
    MEAN_STD_PATH: '/home/mohan/nas_drive/methods/diffusion_gen/data/vae/mean_std_txt/ava_human_nuscenes_waymo'             # Empty = use HUMANML3D.ROOT, or set your path
    EGO_MEAN_STD_PATH: '/home/mohan/nas_drive/methods/diffusion_gen/data/stats'
  SAMPLER:
    MAX_LEN: 196                   # Max motion length
    MIN_LEN: 40                    # Min motion length
    MAX_TEXT_LEN: 20               # Not used for ego, but required

#####################################
# Model Settings
#####################################
model:
  vae: true
  model_type: mld
  condition: 'ego'                 # Changed from 'text'
  latent_dim: [1, 256]             # MLD-1 (best for generation)
  ff_size: 1024
  num_layers: 9
  num_heads: 4
  dropout: 0.1
  activation: gelu
  guidance_scale: 7.5
  guidance_uncondp: 0.1            # 10% dropout for CFG

  # Ego encoder settings
  ego_encoder:
    target: mld.models.architectures.ego_encoder.EgoEncoder
    params:
      input_dim: 2                 # (x, z) lateral motion
      latent_dim: 256
      num_layers: 4
      num_heads: 4
      ff_size: 1024
      dropout: 0.1
      activation: gelu

  # VAE settings (same as HumanML3D MLD)
  motion_vae:
    target: mld.models.architectures.mld_vae.MldVae
    params:
      nfeats: ${DATASET.NFEATS}
      latent_dim: ${model.latent_dim}
      ff_size: 1024
      num_layers: 9
      num_heads: 4
      dropout: 0.1
      activation: gelu
      ablation: ${TRAIN.ABLATION}

  # Denoiser settings
  denoiser:
    target: mld.models.architectures.mld_denoiser.MldDenoiser
    params:
      latent_dim: ${model.latent_dim}
      text_encoded_dim: 256        # Ego encoder output dim
      ff_size: ${model.ff_size}
      num_layers: ${model.num_layers}
      num_heads: ${model.num_heads}
      dropout: ${model.dropout}
      activation: ${model.activation}
      guidance_scale: ${model.guidance_scale}
      guidance_uncondp: ${model.guidance_uncondp}
      ablation: ${TRAIN.ABLATION}
      condition: ${model.condition}
      nfeats: ${DATASET.NFEATS}

  # Scheduler settings
  scheduler:
    target: diffusers.DDIMScheduler
    params:
      num_train_timesteps: 1000
      beta_start: 0.00085
      beta_end: 0.012
      beta_schedule: scaled_linear
      clip_sample: false
      set_alpha_to_one: false
      steps_offset: 0
      prediction_type: epsilon
    num_inference_timesteps: 50
    eta: 0.0

  noise_scheduler:
    target: diffusers.DDPMScheduler
    params:
      num_train_timesteps: 1000
      beta_start: 0.00085
      beta_end: 0.012
      beta_schedule: scaled_linear
      variance_type: fixed_small
      clip_sample: false
      prediction_type: epsilon

#####################################
# Loss Settings
#####################################
LOSS:
  TYPE: mld
  LAMBDA_LATENT: 1.0e-5
  LAMBDA_KL: 1.0e-4
  LAMBDA_REC: 1.0
  LAMBDA_GEN: 1.0
  LAMBDA_CROSS: 1.0
  LAMBDA_CYCLE: 0.0
  LAMBDA_PRIOR: 0.0
  DIST_SYNC_ON_STEP: False

#####################################
# Metric Settings
#####################################
METRIC:
  TYPE: []  # No metrics for ego (TemosMetric requires HumanML3D/KIT)
  FORCE_IN_METER: True
  DIST_SYNC_ON_STEP: False

#####################################
# Logger Settings
#####################################
LOGGER:
  SACE_CHECKPOINT_EPOCH: 100
  LOG_EVERY_STEPS: 1
  VAL_EVERY_STEPS: 100
  TENSORBOARD: True
  WANDB:
    PROJECT: null                  # Set to your wandb project name to enable
    OFFLINE: False
    RESUME_ID: null
